spring.application.name=Vehicle_Routing_Optimization_System

spring.datasource.url=jdbc:postgresql://localhost:5432/vros_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true 
spring.sql.init.mode=always
spring.profiles.default=prod
security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-123456789}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

#dll-auto=create-drop to create tables and drop them when the application is stopped
#dll-auto=validate to validate the schema